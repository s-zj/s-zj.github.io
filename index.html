<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Markdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; height: 100vh; display: flex; }
  textarea { width: 50%; padding: 20px; border: none; border-right: 1px solid #ddd; font: 14px/1.6 monospace; resize: none; outline: none; }
  #preview { width: 50%; padding: 20px; overflow: auto; line-height: 1.6; }
  #preview h1,h2,h3 { margin: 16px 0 8px; }
  #preview p { margin: 8px 0; }
  #preview code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
  #preview pre { background: #f4f4f4; padding: 12px; border-radius: 4px; overflow: auto; }
  #preview blockquote { border-left: 3px solid #ccc; margin: 8px 0; padding-left: 12px; color: #666; }
  #preview ul,ol { margin: 8px 0 8px 24px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<textarea id="input" placeholder="# 在此输入 Markdown&#10;&#10;- 实时预览&#10;- 单文件零配置"></textarea>
<div id="preview"></div>
<script>
const input = document.getElementById('input');
const preview = document.getElementById('preview');
const defaultText = `# 你好，Markdown

这是一个**极简**的单文件实现。

## 特性

- 左侧编辑，右侧实时预览
- 零构建，零依赖（仅一个 CDN）
- 自动保存到浏览器本地

## 示例

\`\`\`js
console.log("Hello World");
\`\`\`

> 简洁胜于复杂。`;

input.value = localStorage.getItem('md') || defaultText;
const render = () => { preview.innerHTML = marked.parse(input.value); localStorage.setItem('md', input.value); };
input.addEventListener('input', render);
render();
</script>
</body>
</html>
